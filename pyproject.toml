[project]
name = "finpilot-ai"
version = "0.1.0"
description = "Business-isolated financial copilot for SMEs"
requires-python = ">=3.13,<3.15"
dependencies = [
  "Django>=5.2.14,<5.3",
  "djangorestframework>=3.16,<4",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.9,<7",
  "gunicorn>=23,<27",
  "pandas>=2.3,<4",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "reportlab>=4.4,<6",
  "python-dotenv>=1.1,<2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vercel]
entrypoint = "config.wsgi:application"
